# ============================================================================
# ZBar 发布流水线：推 v* tag 触发，云端构建 Windows + macOS 双平台安装包
#
# 流程：build（3 平台并行：签名构建 → 上传产物）→ release（生成双源
# latest.json → GitHub Release）
#
# Gitee 更新源不再由 CI 发布（大文件上传偶发挂起耗尽超时），改由本地
# scripts/publish_gitee.sh 手动发布，见脚本头说明
#
# 仓库 Secrets（Settings → Secrets and variables → Actions）：
#   TAURI_SIGNING_PRIVATE_KEY          更新签名私钥内容（~/.tauri/zbar-updater.key）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD 私钥密码（生成时为空可不设置）
#
# 本地发布：改好版本号提交后 `git tag v0.2.0 && git push origin v0.2.0`
# ============================================================================
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis # Windows 更新只用 NSIS，跳过 MSI 省一半时间
            artifact: dist-windows
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: ''
            artifact: dist-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: ''
            artifact: dist-macos-x64
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与版本号一致
        shell: bash
        run: |
          # tag 必须打在版本号已提交的 commit 上，否则 CI 按旧版本号构建、
          # 产物全部标错版本（v1.7.0 踩坑）；workflow_dispatch 触发时跳过。
          # 3 个 matrix 平台各校验一次，开销可忽略
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            CONF_VERSION=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
            if [[ "${GITHUB_REF_NAME#v}" != "$CONF_VERSION" ]]; then
              echo "错误：tag ${GITHUB_REF_NAME} 与 src-tauri/tauri.conf.json 的 version（${CONF_VERSION}）不一致。"
              echo "tag 必须打在版本号已提交的 commit 上：请先提交并推送版本号变更，删除错误 tag 后重新打 tag 触发构建。"
              exit 1
            fi
          else
            echo "非 tag 触发（${GITHUB_REF}），跳过版本号一致性校验"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: 签名构建
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ARGS=(--target "${{ matrix.target }}")
          [[ -n "${{ matrix.bundles }}" ]] && ARGS+=(--bundles ${{ matrix.bundles }})
          npx tauri build "${ARGS[@]}"

      - name: 收集产物（安装包 + .sig 签名）
        shell: bash
        run: |
          mkdir -p out
          BASE="src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$BASE/nsis" -name '*-setup.exe*' -exec cp {} out/ \; 2>/dev/null || true
          find "$BASE/dmg" -name '*.dmg' -exec cp {} out/ \; 2>/dev/null || true
          # macOS 更新包产物名固定为 <产品名>.app.tar.gz（不带架构），手动补后缀：
          # 两个 mac 架构同名会互相覆盖，且 latest.json 需按架构区分下载地址
          if [[ -d "$BASE/macos" ]]; then
            case "${{ matrix.target }}" in
              aarch64-*) SUFFIX=aarch64 ;;
              x86_64-*)  SUFFIX=x64 ;;
            esac
            for f in "$BASE/macos/"*.app.tar.gz; do
              [[ -e "$f" ]] || continue
              stem="$(basename "$f" .app.tar.gz)"
              cp "$f" "out/${stem}_${SUFFIX}.app.tar.gz"
              [[ -f "$f.sig" ]] && cp "$f.sig" "out/${stem}_${SUFFIX}.app.tar.gz.sig"
            done
          fi
          echo '--- out ---'
          ls -la out/
          [[ $(ls out | wc -l) -gt 0 ]] || { echo '未收集到任何产物'; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # 发布总限时：只上传 GitHub Release，正常几分钟即可完成；超时整体失败
    # 可重跑（发布步骤幂等：先删旧 release 再建新），
    # 早失败早重跑优于默认 6h 空等
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: 生成双源 latest.json
        env:
          GH_REPO_NAME: codez-yydd/AgentHUD
          GITEE_REPO_NAME: codezwx/AgentHUD
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # gen_latest.py 是子进程，VERSION 不 export 读不到，会回退读
          # tauri.conf.json（tag 打错时拿到旧版本号）
          export VERSION

          GH_BASE="https://github.com/$GH_REPO_NAME/releases/download/v$VERSION"
          GITEE_BASE="https://gitee.com/$GITEE_REPO_NAME/releases/download/latest"
          python3 scripts/gen_latest.py "$GH_BASE" out/latest.json
          python3 scripts/gen_latest.py "$GITEE_BASE" out/gitee-latest.json
          cat out/latest.json

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: codez-yydd/AgentHUD
        run: |
          # 重跑幂等：上次失败可能留下残缺 release，先清理（tag 保留）
          gh release view "v$VERSION" >/dev/null 2>&1 && gh release delete "v$VERSION" --yes || true
          # Release 说明（Markdown 分类条目版，与线上已更新的说明保持一致，防止重跑回退）
          NOTES="## ✨ 新功能
          - 主窗口新增额度驾驶舱页：各 Agent 订阅额度以仪表盘呈现——仪器卡、剩余趋势曲线与重置轨道，多窗口余量和重置节奏一眼看全
          - 主窗口新增凭证账号页：多账号凭证集中管理，支持 ZCode 账号自动捕获，新登录自动发现无需手动录入
          - 主窗口新增同步与设备管理页：大屏版同步中心——本机同步状态、服务端设备管理（改名 / 合并 / 删数据）与自动清理配置
          - 主窗口新增模型速度排行榜页：聚合全部来源、按渠道区分同名模型的速度对比，支持自定义时间范围与本机 / 全部设备切换
          - 主窗口新增设置页：语言、外观主题、币种（跟随语言 / 人民币 / 美元）、自动捕获新登录、HUD 停靠条开关五项应用级设置
          - 统一主窗口各页时间范围为四档快捷切换，总览页默认展示今日

          ## 🐛 修复
          - 修复 HUD 停靠条在鼠标静止、未悬停时详情卡反复自动弹出：条目改为差量渲染不再全量重建，悬停开卡需真实指针活动且停留判定加长
          - 根治多设备同步上传落盘竞态，避免上传游标回退导致的重复上传

          ## 🔧 服务端（自部署用户更新 server/ 后生效）
          - 设备列表接口新增各设备最后活跃时刻，配合主窗口同步页设备表展示"
          gh release create "v$VERSION" out/* \
            --title "AgentHUD v$VERSION" \
            --notes "$NOTES" \
            --latest

      # Gitee 更新源由本地 scripts/publish_gitee.sh 发布，见脚本头说明
