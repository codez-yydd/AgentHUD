# ============================================================================
# ZBar 发布流水线：推 v* tag 触发，云端构建 Windows + macOS 双平台安装包
#
# 流程：build（3 平台并行：签名构建 → 上传产物）→ release（生成双源
# latest.json → GitHub Release）
#
# Gitee 更新源不再由 CI 发布（大文件上传偶发挂起耗尽超时），改由本地
# scripts/publish_gitee.sh 手动发布，见脚本头说明
#
# 仓库 Secrets（Settings → Secrets and variables → Actions）：
#   TAURI_SIGNING_PRIVATE_KEY          更新签名私钥内容（~/.tauri/zbar-updater.key）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD 私钥密码（生成时为空可不设置）
#
# 本地发布：改好版本号提交后 `git tag v0.2.0 && git push origin v0.2.0`
# ============================================================================
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis # Windows 更新只用 NSIS，跳过 MSI 省一半时间
            artifact: dist-windows
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: ''
            artifact: dist-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: ''
            artifact: dist-macos-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: 签名构建
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ARGS=(--target "${{ matrix.target }}")
          [[ -n "${{ matrix.bundles }}" ]] && ARGS+=(--bundles ${{ matrix.bundles }})
          npx tauri build "${ARGS[@]}"

      - name: 收集产物（安装包 + .sig 签名）
        shell: bash
        run: |
          mkdir -p out
          BASE="src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$BASE/nsis" -name '*-setup.exe*' -exec cp {} out/ \; 2>/dev/null || true
          find "$BASE/dmg" -name '*.dmg' -exec cp {} out/ \; 2>/dev/null || true
          # macOS 更新包产物名固定为 <产品名>.app.tar.gz（不带架构），手动补后缀：
          # 两个 mac 架构同名会互相覆盖，且 latest.json 需按架构区分下载地址
          if [[ -d "$BASE/macos" ]]; then
            case "${{ matrix.target }}" in
              aarch64-*) SUFFIX=aarch64 ;;
              x86_64-*)  SUFFIX=x64 ;;
            esac
            for f in "$BASE/macos/"*.app.tar.gz; do
              [[ -e "$f" ]] || continue
              stem="$(basename "$f" .app.tar.gz)"
              cp "$f" "out/${stem}_${SUFFIX}.app.tar.gz"
              [[ -f "$f.sig" ]] && cp "$f.sig" "out/${stem}_${SUFFIX}.app.tar.gz.sig"
            done
          fi
          echo '--- out ---'
          ls -la out/
          [[ $(ls out | wc -l) -gt 0 ]] || { echo '未收集到任何产物'; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # 发布总限时：只上传 GitHub Release，正常几分钟即可完成；超时整体失败
    # 可重跑（发布步骤幂等：先删旧 release 再建新），
    # 早失败早重跑优于默认 6h 空等
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: 生成双源 latest.json
        env:
          GH_REPO_NAME: codez-yydd/zai-floating-monitor
          GITEE_REPO_NAME: codezwx/zai-floating-monitor
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          GH_BASE="https://github.com/$GH_REPO_NAME/releases/download/v$VERSION"
          GITEE_BASE="https://gitee.com/$GITEE_REPO_NAME/releases/download/latest"
          python3 scripts/gen_latest.py "$GH_BASE" out/latest.json
          python3 scripts/gen_latest.py "$GITEE_BASE" out/gitee-latest.json
          cat out/latest.json

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: codez-yydd/zai-floating-monitor
        run: |
          # 重跑幂等：上次失败可能留下残缺 release，先清理（tag 保留）
          gh release view "v$VERSION" >/dev/null 2>&1 && gh release delete "v$VERSION" --yes || true
          # Release 说明（Markdown 分类条目版，与线上已更新的说明保持一致，防止重跑回退）
          NOTES="## 🐛 问题修复

          - **多账号面板额度错配（Pro 显示成 Max、未使用账号出现「今日增量」）** — 账号额度面板为每个账号查额度时，凭证采取三级回退：优先用该账号快照自己的账号级套餐凭证（可与账号身份精确对应），失败再退到快照里的 config 凭证。问题出在回退猜错了归属：ZCode 的凭证文件里套餐键跨账号累积存在，某个账号的凭证解不开时，程序会「取第一个可用键」——取到的往往是**另一个账号**的凭证，于是两个账号显示同一份额度（Pro 条目显示成 Max 的级别），当天没用过的账号也显示「今日 N%」；错配结果还会按该账号身份记入历史采样并同步到其他设备
          - **现在的处理方式** — 多账号（本机存在 2 个及以上账号）时，凭证必须与账号身份精确对应：只有当快照里恰好只有一个可用套餐键时才回退取用它；匹配不上就明确显示「该账号快照无可用 Coding Plan 凭证，请切换到该账号后重新捕获」，不再猜。单账号用户的所有行为保持不变（仍按原三级回退）
          - **跨设备合并时「今日增量」可能显示成数万百分比、或取自异常设备的错误数值** — 「↑今日 N%」按「额度回落视为重置、分段累计消耗」计算；当其它设备上传的采样来源异常（如旧版本凭证错配把别的账号数值按本账号指纹上传，脏值与正常值按时间交错）时，序列会反复「回落又上涨」，每一对振荡都被当成一次「重置消耗」累计，几百条采样能累计出几万百分比（如显示 79963%）；若只在异常序列里改算「今日峰值 − 今日首条」，峰值本身仍取自脏值（例如本机实际已用 43% 却显示 87%）。现已加数据源异常防护：某账号今日回落次数超过 5 次即判定多设备合并数据打架，**自动改用本机数据源重算**（本机是当前设备、凭证链路已收紧，可信度更高）；只有本机今天没采到该账号时才回退「峰值 − 首条」安全口径（结果恒在 0-100% 内，宁可少算也不显示爆炸数字）。正常日期的多设备分段累计照旧（一天内自然重置 + 重置券远达不到 5 次上限）
          - **Kimi OAuth 凭据失效后不再无限自动重试刷日志** — Kimi 的 refresh_token 一旦被服务端判定失效（invalid_grant），只有重新登录才能救活，但程序此前每轮额度轮询都会重试一次续期：白打一次刷新请求、回退旧 token、再被 401 拒绝，日志无限刷屏。现在两条续期链路（CLI 凭据与凭证体系）都加了熔断：**连续 10 次「需重登」类失败后自动停止重试**，只留一条汇总日志提示重新登录；网络类失败不计数（短暂抖动不会误停续期），凭据变化（重新登录 CLI 或在应用内重新添加凭证）自动清零并恢复自动续期"
          gh release create "v$VERSION" out/* \
            --title "ZBar v$VERSION" \
            --notes "$NOTES" \
            --latest

      # Gitee 更新源由本地 scripts/publish_gitee.sh 发布，见脚本头说明
