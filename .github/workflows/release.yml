# ============================================================================
# ZBar 发布流水线：推 v* tag 触发，云端构建 Windows + macOS 双平台安装包
#
# 流程：build（3 平台并行：签名构建 → 上传产物）→ release（生成双源
# latest.json → GitHub Release）
#
# Gitee 更新源不再由 CI 发布（大文件上传偶发挂起耗尽超时），改由本地
# scripts/publish_gitee.sh 手动发布，见脚本头说明
#
# 仓库 Secrets（Settings → Secrets and variables → Actions）：
#   TAURI_SIGNING_PRIVATE_KEY          更新签名私钥内容（~/.tauri/zbar-updater.key）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD 私钥密码（生成时为空可不设置）
#
# 本地发布：改好版本号提交后 `git tag v0.2.0 && git push origin v0.2.0`
# ============================================================================
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis # Windows 更新只用 NSIS，跳过 MSI 省一半时间
            artifact: dist-windows
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: ''
            artifact: dist-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: ''
            artifact: dist-macos-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: 签名构建
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ARGS=(--target "${{ matrix.target }}")
          [[ -n "${{ matrix.bundles }}" ]] && ARGS+=(--bundles ${{ matrix.bundles }})
          npx tauri build "${ARGS[@]}"

      - name: 收集产物（安装包 + .sig 签名）
        shell: bash
        run: |
          mkdir -p out
          BASE="src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$BASE/nsis" -name '*-setup.exe*' -exec cp {} out/ \; 2>/dev/null || true
          find "$BASE/dmg" -name '*.dmg' -exec cp {} out/ \; 2>/dev/null || true
          # macOS 更新包产物名固定为 <产品名>.app.tar.gz（不带架构），手动补后缀：
          # 两个 mac 架构同名会互相覆盖，且 latest.json 需按架构区分下载地址
          if [[ -d "$BASE/macos" ]]; then
            case "${{ matrix.target }}" in
              aarch64-*) SUFFIX=aarch64 ;;
              x86_64-*)  SUFFIX=x64 ;;
            esac
            for f in "$BASE/macos/"*.app.tar.gz; do
              [[ -e "$f" ]] || continue
              stem="$(basename "$f" .app.tar.gz)"
              cp "$f" "out/${stem}_${SUFFIX}.app.tar.gz"
              [[ -f "$f.sig" ]] && cp "$f.sig" "out/${stem}_${SUFFIX}.app.tar.gz.sig"
            done
          fi
          echo '--- out ---'
          ls -la out/
          [[ $(ls out | wc -l) -gt 0 ]] || { echo '未收集到任何产物'; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # 发布总限时：只上传 GitHub Release，正常几分钟即可完成；超时整体失败
    # 可重跑（发布步骤幂等：先删旧 release 再建新），
    # 早失败早重跑优于默认 6h 空等
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: 生成双源 latest.json
        env:
          GH_REPO_NAME: codez-yydd/zai-floating-monitor
          GITEE_REPO_NAME: codezwx/zai-floating-monitor
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          GH_BASE="https://github.com/$GH_REPO_NAME/releases/download/v$VERSION"
          GITEE_BASE="https://gitee.com/$GITEE_REPO_NAME/releases/download/latest"
          python3 scripts/gen_latest.py "$GH_BASE" out/latest.json
          python3 scripts/gen_latest.py "$GITEE_BASE" out/gitee-latest.json
          cat out/latest.json

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: codez-yydd/zai-floating-monitor
        run: |
          # 重跑幂等：上次失败可能留下残缺 release，先清理（tag 保留）
          gh release view "v$VERSION" >/dev/null 2>&1 && gh release delete "v$VERSION" --yes || true
          # Release 说明（Markdown 分类条目版，与线上已更新的说明保持一致，防止重跑回退）
          NOTES="## ✨ 新功能

          - **四个面板支持手动添加 API Key（Kimi Code / MiniMax Code / OpenCode / DeepSeek Harness）** — 面板底部新增可折叠的凭证区（有凭证时自动展开）：把订阅用在别的 agent、本机没装（或不想装）对应官方 CLI 时，粘贴一个 Key 就能直连官方接口读额度，多订阅可堆叠显示、可备注、可切换区域
          - **MiniMax Code：手动录入 Coding Plan Key** — 粘贴 sk-cp- 开头的 API Key（区分中国站 / 国际站）即显示当前窗口与本周用量；没装 MiniMax Code 也能查套餐额度
          - **OpenCode：手动录入 Go 计划 API Key** — 粘贴 OpenCode Console 的 API Key 即显示 5 小时 / 本周 / 本月三档官方用量百分比与重置时间（查询不消耗套餐额度），与本地库估算并列展示
          - **DeepSeek Harness：新增「DeepSeek 平台余额」区** — 粘贴 DeepSeek 开放平台 API Key 即显示账户余额与赠送 / 充值拆分；DSH 自身按量计费、没有订阅额度窗口，这条通道是「把 DeepSeek 额度用在别的 agent」时唯一能看到余额的入口
          - **Kimi Code 的「其他账号」区与其余三个面板统一** — 网页登录（设备码流程，无需安装 CLI）与 API Key 两种录入形态、区域切换、多账号堆叠全部保持不变，只是换成同一个通用区块
          - **OpenCode 与 MiniMax Code 可在标签栏「＋添加服务」浮层直接录入** — 全新机器没有任何本地数据时也能先录 Key，录完对应标签页自动出现

          ## 🐛 问题修复

          - **没装官方 CLI 就看不了订阅额度** — 此前 OpenCode / MiniMax Code / DeepSeek 三个服务不提供凭证录入入口（只能读取本机已有凭证或本地数据），把订阅用在别的 agent 的用户在界面上无路可走；本次放开入口并接出额度卡
          - **MiniMax Code 凭证空态误用 OpenCode 文案** — 双数据源空态提示改为 MiniMax 专属（此前会提示去安装 OpenCode CLI）"
          gh release create "v$VERSION" out/* \
            --title "ZBar v$VERSION" \
            --notes "$NOTES" \
            --latest

      # Gitee 更新源由本地 scripts/publish_gitee.sh 发布，见脚本头说明
