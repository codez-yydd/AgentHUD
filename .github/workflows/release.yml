# ============================================================================
# ZBar 发布流水线：推 v* tag 触发，云端构建 Windows + macOS 双平台安装包
#
# 流程：build（3 平台并行：签名构建 → 上传产物）→ release（生成双源
# latest.json → GitHub Release）
#
# Gitee 更新源不再由 CI 发布（大文件上传偶发挂起耗尽超时），改由本地
# scripts/publish_gitee.sh 手动发布，见脚本头说明
#
# 仓库 Secrets（Settings → Secrets and variables → Actions）：
#   TAURI_SIGNING_PRIVATE_KEY          更新签名私钥内容（~/.tauri/zbar-updater.key）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD 私钥密码（生成时为空可不设置）
#
# 本地发布：改好版本号提交后 `git tag v0.2.0 && git push origin v0.2.0`
# ============================================================================
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis # Windows 更新只用 NSIS，跳过 MSI 省一半时间
            artifact: dist-windows
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: ''
            artifact: dist-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: ''
            artifact: dist-macos-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: 签名构建
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ARGS=(--target "${{ matrix.target }}")
          [[ -n "${{ matrix.bundles }}" ]] && ARGS+=(--bundles ${{ matrix.bundles }})
          npx tauri build "${ARGS[@]}"

      - name: 收集产物（安装包 + .sig 签名）
        shell: bash
        run: |
          mkdir -p out
          BASE="src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$BASE/nsis" -name '*-setup.exe*' -exec cp {} out/ \; 2>/dev/null || true
          find "$BASE/dmg" -name '*.dmg' -exec cp {} out/ \; 2>/dev/null || true
          # macOS 更新包产物名固定为 <产品名>.app.tar.gz（不带架构），手动补后缀：
          # 两个 mac 架构同名会互相覆盖，且 latest.json 需按架构区分下载地址
          if [[ -d "$BASE/macos" ]]; then
            case "${{ matrix.target }}" in
              aarch64-*) SUFFIX=aarch64 ;;
              x86_64-*)  SUFFIX=x64 ;;
            esac
            for f in "$BASE/macos/"*.app.tar.gz; do
              [[ -e "$f" ]] || continue
              stem="$(basename "$f" .app.tar.gz)"
              cp "$f" "out/${stem}_${SUFFIX}.app.tar.gz"
              [[ -f "$f.sig" ]] && cp "$f.sig" "out/${stem}_${SUFFIX}.app.tar.gz.sig"
            done
          fi
          echo '--- out ---'
          ls -la out/
          [[ $(ls out | wc -l) -gt 0 ]] || { echo '未收集到任何产物'; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # 发布总限时：只上传 GitHub Release，正常几分钟即可完成；超时整体失败
    # 可重跑（发布步骤幂等：先删旧 release 再建新），
    # 早失败早重跑优于默认 6h 空等
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: 生成双源 latest.json
        env:
          GH_REPO_NAME: codez-yydd/AgentHUD
          GITEE_REPO_NAME: codezwx/AgentHUD
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          GH_BASE="https://github.com/$GH_REPO_NAME/releases/download/v$VERSION"
          GITEE_BASE="https://gitee.com/$GITEE_REPO_NAME/releases/download/latest"
          python3 scripts/gen_latest.py "$GH_BASE" out/latest.json
          python3 scripts/gen_latest.py "$GITEE_BASE" out/gitee-latest.json
          cat out/latest.json

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: codez-yydd/AgentHUD
        run: |
          # 重跑幂等：上次失败可能留下残缺 release，先清理（tag 保留）
          gh release view "v$VERSION" >/dev/null 2>&1 && gh release delete "v$VERSION" --yes || true
          # Release 说明（Markdown 分类条目版，与线上已更新的说明保持一致，防止重跑回退）
          NOTES="## ✨ 新功能

          - **注入版对话页底部状态条（分段式）** — 输入框下方由单一额度行升级为分段式用量状态条：生成速度（三档配色）、本轮 Token、会话累计、工具调用数、今日合计、子代理用量、订阅额度（5h / 每周含重置倒计时）与缓存命中率一屏尽览；玻璃拟态胶囊样式与输入框卡片左右缘精确对齐，宽度不足时按优先级自动收纳分段，速度与额度等关键分段永不隐藏
          - **每轮 / 会话统计条新增缓存命中率** — 消息流内的每轮统计条与输入框上方的会话累计条，在缓存读后追加命中率（如 ⟲ 342k (90.5%)），与底部状态条同口径；缓存写为 0 时不再显示 ✚0 段，避免困惑
          - **注入统计条视觉统一** — 字体与配色跟随 ZCode 客户端主题变量（亮暗主题自动跟随），速度值全端统一三档配色（≥70 绿 / 40-70 黄 / <40 红），模型速度行同步适配

          ## 🐛 问题修复

          - **思考型模型 Token 速度虚高** — ZCode 的输出 Token 已包含思考 Token，而思考发生在首字之前，原口径「输出 ÷（完成 − 首字）」把思考时长漏出分母，思考型请求（GLM 思考模式 / Claude 系）速度系统性偏高（实测部分请求虚超 300 t/s）；现思考型请求生成窗口按全程计算，注入统计条、会话悬浮窗、主面板速度、请求日志、项目统计全端生效，并拒收 <200ms 抖动样本与 >1 小时挂死样本
          - **请求日志页速度口径统一** — 该页速度此前由前端按「耗时 − 首字」自算、未走全端统一判定；现接入行级统一真源，时序异常 / 窗口越界的行不再显示错误速度；无绝对时间戳的来源按总耗时近似并如实标注 ≈
          - **主窗口时间范围弹层被裁切** — 窗口较窄、页头操作区换行贴左时，自定义时间范围弹层左半会被主区边缘裁掉（起止字段卡显示为空白框）；现按最近裁切容器边界夹取，总览 / 日志 / 对比三个页面弹层均完整可见

          ## 📦 升级说明（v1.6.0 → 1.6.1）

          - **注入版统计条自动升级** — 已安装注入主题的用户升级后重启 ZCode，统计条自动升级为新版，无需重新安装主题
          - 本次更新同时刷新了文档中的 Token 说明截图"
          gh release create "v$VERSION" out/* \
            --title "AgentHUD v$VERSION" \
            --notes "$NOTES" \
            --latest

      # Gitee 更新源由本地 scripts/publish_gitee.sh 发布，见脚本头说明
