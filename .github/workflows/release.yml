# ============================================================================
# ZBar 发布流水线：推 v* tag 触发，云端构建 Windows + macOS 双平台安装包
#
# 流程：build（3 平台并行：签名构建 → 上传产物）→ release（生成双源
# latest.json → GitHub Release）
#
# Gitee 更新源不再由 CI 发布（大文件上传偶发挂起耗尽超时），改由本地
# scripts/publish_gitee.sh 手动发布，见脚本头说明
#
# 仓库 Secrets（Settings → Secrets and variables → Actions）：
#   TAURI_SIGNING_PRIVATE_KEY          更新签名私钥内容（~/.tauri/zbar-updater.key）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD 私钥密码（生成时为空可不设置）
#
# 本地发布：改好版本号提交后 `git tag v0.2.0 && git push origin v0.2.0`
# ============================================================================
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis # Windows 更新只用 NSIS，跳过 MSI 省一半时间
            artifact: dist-windows
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: ''
            artifact: dist-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: ''
            artifact: dist-macos-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: 签名构建
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ARGS=(--target "${{ matrix.target }}")
          [[ -n "${{ matrix.bundles }}" ]] && ARGS+=(--bundles ${{ matrix.bundles }})
          npx tauri build "${ARGS[@]}"

      - name: 收集产物（安装包 + .sig 签名）
        shell: bash
        run: |
          mkdir -p out
          BASE="src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$BASE/nsis" -name '*-setup.exe*' -exec cp {} out/ \; 2>/dev/null || true
          find "$BASE/dmg" -name '*.dmg' -exec cp {} out/ \; 2>/dev/null || true
          # macOS 更新包产物名固定为 <产品名>.app.tar.gz（不带架构），手动补后缀：
          # 两个 mac 架构同名会互相覆盖，且 latest.json 需按架构区分下载地址
          if [[ -d "$BASE/macos" ]]; then
            case "${{ matrix.target }}" in
              aarch64-*) SUFFIX=aarch64 ;;
              x86_64-*)  SUFFIX=x64 ;;
            esac
            for f in "$BASE/macos/"*.app.tar.gz; do
              [[ -e "$f" ]] || continue
              stem="$(basename "$f" .app.tar.gz)"
              cp "$f" "out/${stem}_${SUFFIX}.app.tar.gz"
              [[ -f "$f.sig" ]] && cp "$f.sig" "out/${stem}_${SUFFIX}.app.tar.gz.sig"
            done
          fi
          echo '--- out ---'
          ls -la out/
          [[ $(ls out | wc -l) -gt 0 ]] || { echo '未收集到任何产物'; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # 发布总限时：只上传 GitHub Release，正常几分钟即可完成；超时整体失败
    # 可重跑（发布步骤幂等：先删旧 release 再建新），
    # 早失败早重跑优于默认 6h 空等
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: 生成双源 latest.json
        env:
          GH_REPO_NAME: codez-yydd/zai-floating-monitor
          GITEE_REPO_NAME: codezwx/zai-floating-monitor
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          GH_BASE="https://github.com/$GH_REPO_NAME/releases/download/v$VERSION"
          GITEE_BASE="https://gitee.com/$GITEE_REPO_NAME/releases/download/latest"
          python3 scripts/gen_latest.py "$GH_BASE" out/latest.json
          python3 scripts/gen_latest.py "$GITEE_BASE" out/gitee-latest.json
          cat out/latest.json

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: codez-yydd/zai-floating-monitor
        run: |
          # 重跑幂等：上次失败可能留下残缺 release，先清理（tag 保留）
          gh release view "v$VERSION" >/dev/null 2>&1 && gh release delete "v$VERSION" --yes || true
          # Release 说明（Markdown 分类条目版，与线上已更新的说明保持一致，防止重跑回退）
          NOTES="## ✨ 新功能

          - **新增 DeepSeek Harness（DSH）用量来源** — 解析本机 ~/.dsh 会话事件日志统计 Token 用量与花费，与 ZCode / Claude / Codex 同级接入：tab 面板、项目页、汇总 / 对比 / 报告页与会话悬浮窗全部打通，并参与多设备同步上传
          - **新增 OpenCode 用量来源（本地库 + 官方接口双通道）** — 解析本机 ~/.local/share/opencode/opencode.db 统计用量（v1 / v2 两代库结构自适应），新增独立用量页并接入汇总 / 对比 / 报告 / 会话悬浮窗；OpenCode Go 支持用官方 API Key 直连读取额度与用量（不装 CLI 也能监控），无 Key 时回退本地库估算
          - **新增 MiniMax Code 本地用量采集** — 只读解析本机 ~/.minimax 数据统计用量与花费，并按产品口径合并进既有 MiniMax 页签（上半套餐额度卡、下半本地用量面板），不再多出第二个 MiniMax 标签
          - **MiniMax 套餐额度零配置可读** — 直接复用 MiniMax Code 自身的 OAuth 登录态查询 5 小时 / 周额度，不再强制手填 sk-cp- Key；已配置凭证的机器仍以凭证为准，同一账号绝不叠加两条
          - **会话悬浮窗按 agent 分组闭环** — 补齐 Kimi Code / OpenCode / MiniMax Code 的会话明细与 DSH 的实时生成状态（读会话投影判定当前轮未结束，带新鲜度上限避免僵尸轮常亮）；底部新增「来源 × 模型」速度行（真生成窗口口径不带 ≈，整请求耗时口径带 ≈，同一模型多来源自动加来源名消歧）；活跃窗口内无会话的 agent 回退展示「今日最近会话」并淡显标注，组头仍为该 agent 今日合计
          - **来源标签栏支持鼠标滚轮横滑** — agent 变多后标签溢出时，滚轮 / 触控板横向手势即可横滑（不溢出时完全不介入，滑到两端把事件还给页面，不与页面滚动打架）
          - **凭证入口收口为 agent 口径** — 与本地采集重复的「DeepSeek 余额」「Kimi 开放平台余额」两项下架：不再进设置列表、不再有页签与额度轮询，已存凭证与历史数据仍可安全读取；自带 CLI 与订阅的 agent 统一归入设置页「本地采集」分组

          ## 🐛 问题修复

          - **第三方模型花费恒为 0** — Kimi Code 里使用第三方模型时落盘的模型 id 带 provider 配置名前缀（如 zhipuai-coding-plan/glm-5.3-flash）查不到价格，花费显示 0、价格页还误报「新增模型」；价格查找与显示改为「原始 id → 去掉首个斜杠前缀」双候选匹配，模型名不再被斜杠截断
          - **模型名显示多余前缀** — 界面显示去掉 provider 配置名前缀的短名；完整模型 id 仍是分组折叠、计费、同步与价格查找的唯一依据，工具提示保留完整 id
          - **Kimi 凭据失效提示误导** — 额度拉取失败原先一律显示「网络错误或服务不可用: status code 400」；现按状态码分类，400 / 401 / 403 明确提示需重新登录 Kimi Code CLI 并附服务端错误说明（只取固定字段，绝不回显响应体）
          - **设置页把 Kimi 误归入凭证接入** — 分组改为按「数据从哪来」判定，Kimi 回到「本地采集」（有凭证体系不等于数据来自凭证）
          - **会话悬浮窗状态显示问题** — 今日合计行改为常驻显示、不再依赖有活跃会话；短会话标识修正（DSH 的 session- 前缀、Kimi 路径型会话 id 不再截成 C 盘路径开头几个字符）
          - **名称与图标与实际不符** — 本地采集型 Kimi 显示名改为「Kimi Code」，开放平台来源改名「Kimi」（provider id 不变，已存凭证与同步数据不受影响）；Kimi Code、OpenCode、MiniMax Code 统一换成官方图标"
          gh release create "v$VERSION" out/* \
            --title "ZBar v$VERSION" \
            --notes "$NOTES" \
            --latest

      # Gitee 更新源由本地 scripts/publish_gitee.sh 发布，见脚本头说明
