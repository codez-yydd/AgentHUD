[package]
name = "zai-floating-monitor"
version = "1.8.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zai_floating_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
# 动态壁纸皮肤页选择壁纸文件
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
# 更新检查：发布日期按 RFC3339 格式化（与官方 updater 插件命令的写法一致）
time = { version = "0.3", features = ["formatting"] }
open = "5"
ureq = { version = "2", features = ["json", "socks-proxy"] }
base64 = "0.22"
# 账号切换与额度查询：解密 ZCode 凭证（AES-256-GCM）
aes-gcm = "0.10"
sha2 = "0.10"
# 自定义宠物导入与截图：图片解码/编码（png + jpeg + webp）
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# 截图二维码识别（纯 Rust，本地解码）与 GIF 录屏
rqrr = "0.11"
gif = "0.14"
# 自定义宠物导入：Petdex 分发 zip 包（根目录 pet.json + spritesheet）解包；
# 仅需 DEFLATE 与 STORED，关默认特性减体积
zip = { version = "2", default-features = false, features = ["deflate"] }
# Kimi OAuth 设备码登录：无本地 device_id 时生成 UUID v4（与 Kimi Code CLI 共享）
uuid = { version = "1", features = ["v4"] }
# DeepSeek Harness 会话日志：session.v4.jsonl.zstd 为多帧串联 zstd，
# 用纯 Rust 解码器（不引入 C 工具链，Windows 构建无需原生 zstd 依赖）
ruzstd = "0.8"
# 灵动岛：剪贴板历史（文本/图片）与股票行情 GBK 解码
arboard = "3.6"
encoding_rs = "0.8"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# 录屏 MP4 封装：VideoToolbox 出 H.264 裸流，mp4 crate 写容器（纯 Rust）
mp4 = "0.14"
# 录屏：ScreenCaptureKit 流式抓屏（60fps + 系统声音），macOS 15+ 走 SCRecordingOutput
objc2-screen-capture-kit = "0.3"
block2 = "0.6"
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = { version = "0.3", features = ["NSProcessInfo"] }

[target.'cfg(windows)'.dependencies]
# 读取 Windows 系统代理设置（HKCU Internet Settings），wham/usage 实时额度查询用
winreg = "0.52"
# 灵动岛：SMTC 媒体会话、Core Audio 音量、Wi-Fi/蓝牙电台、全屏检测
windows = { version = "0.61", features = [
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
  "Media_Control",
  "Media_Ocr",
  "Graphics_Imaging",
  "Globalization",
  "Devices_Radios",
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Security_Credentials",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
